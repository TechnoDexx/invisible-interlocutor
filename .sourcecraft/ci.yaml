on:
  pull_request:
    - workflows: [build]
      filter:
        source_branches: ["**"]
        target_branches: ["main"]

  push:
    - workflows: [build]
      filter:
        branches: ["main", "work"]

workflows:
  build:
    tasks:
      - name: compile
        cubes:
          - name: build-binary
            image: androsh7/nuitka-compiler:latest-x86_64-glibc-2.28-py3.12
            script:
              - ln -sf /usr/bin/python3 /usr/bin/python
              - pip install -r requirements.txt
              - python -m nuitka --onefile --output-dir=dist --output-file=invisible-interlocutor main.py
            artifacts:
              paths:
                - dist/invisible-interlocutor