on:
  pull_request:
    - workflows: [build]
      filter:
        source_branches: ["**"]
        target_branches: ["main"]

  push:
    - workflows: [build]
      filter:
        branches: ["main", "work"]

workflows:
  build:
    tasks:
      - name: compile
        cubes:
          - name: build-binary
            image: docker.io/library/python:3.12
            script:
              - apt-get update && apt-get install -y git build-essential autoconf automake libtool
              - git clone -b 0.17.2 --single-branch https://github.com/NixOS/patchelf
              - cd patchelf && ./bootstrap.sh && ./configure && make && make install && cd ..
              - pip install --upgrade pip
              - pip install -r requirements.txt
              - pip install nuitka
              - python3 -m nuitka --onefile --output-dir=dist --output-file=invisible-interlocutor main.py
            artifacts:
              paths:
                - dist/invisible-interlocutor