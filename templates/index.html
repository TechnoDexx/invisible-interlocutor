{% extends "base.html" %}

{% block title %}Чат{% endblock %}

{% block content %}
<div class="chat-box" id="chatBox">
    {% for message in history %}
        <div class="message {{ message.role }}">{{ message.content }}</div>
    {% endfor %}
</div>

<div id="input-area" class="row g-2">
    <div class="col-10">
        <input type="text" id="msg-input" class="form-control bg-dark text-light border-0" placeholder="Напишите что-нибудь..." autofocus>
    </div>
    <div class="col-2">
        <button id="send-btn" class="btn btn-primary w-100">Отправить</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const input = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const chatBox = document.getElementById('chatBox');

    function appendMessage(text, role) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        appendMessage(text, 'user');
        try {
            const formData = new FormData();
            formData.append('user_message', text);
            const response = await fetch('/send', { method: 'POST', body: formData });
            const data = await response.json();
            if (data.reply) {
                appendMessage(data.reply, 'assistant');
            } else {
                appendMessage('Ошибка: ' + (data.error || 'неизвестно'), 'assistant');
            }
        } catch (e) {
            appendMessage('Ошибка соединения', 'assistant');
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
{% endblock %}
